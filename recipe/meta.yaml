{% set name = "XStatic-Font-Awesome" %}
{% set version = "6.2.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') | lower }}-{{ version }}.tar.gz
  sha256: 9f3cb2f038fad7d352722375d3f25af346da9ee093ed9dc2c8c46bd911ab1971

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  build:
    - python {{ python_min }}
    - pip
    - setuptools
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - xstatic.pkg.font_awesome
  require:
    - python {{ python_min }}

about:
  home: https://github.com/FortAwesome/Font-Awesome
  summary: Font-Awesome 6.2.1 (XStatic packaging standard)
  license: CC-BY-4.0 AND OFL-1.1 AND MIT
  license_file:
    - xstatic/pkg/font_awesome/data/LICENSE.txt

extra:
  recipe-maintainers:
    - ReimarBauer
